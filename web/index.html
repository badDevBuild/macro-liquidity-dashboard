<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta id="theme-color" name="theme-color" content="#f2f7f4">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="每天用官方数据观察宏观流动性的方向与变化">
    <title>流动性观测台</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <script>
      if (window.location.protocol === "file:") {
        window.location.replace(`https://shushu.host/liquidity/${window.location.hash || "#overview"}`);
      }
    </script>
    <script>
      (() => {
        const key = "macro-liquidity-theme";
        let theme = null;
        try {
          theme = localStorage.getItem(key);
        } catch {
          theme = null;
        }
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector("#theme-color").content = theme === "dark" ? "#18211e" : "#f2f7f4";
      })();
    </script>
    <link rel="stylesheet" href="assets/app.css?v=47">
    <script src="assets/coinbase-premium.js?v=47" defer></script>
    <script src="assets/app.js?v=47" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>

    <div id="offline-banner" class="offline-banner" hidden>
      当前离线，正在显示这台设备最后保存的一次数据。
    </div>

    <header class="topbar">
      <a class="brand" href="#overview" aria-label="返回总览">
        <svg class="brand-mark" viewBox="0 0 36 36" aria-hidden="true">
          <path d="M7 25.5h5.5v-8H18v-6h5.5V7H29"></path>
          <circle cx="7" cy="25.5" r="2"></circle>
          <circle cx="18" cy="17.5" r="2"></circle>
          <circle cx="29" cy="7" r="2"></circle>
        </svg>
        <span>
          <strong>流动性观测台</strong>
          <small id="brand-date">最近一次更新</small>
        </span>
      </a>
      <div class="topbar-actions">
        <span id="compact-status" class="compact-status status-loading">读取中</span>
        <button id="theme-toggle" class="icon-button theme-toggle" type="button" aria-label="切换到夜间模式" aria-pressed="false">
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"></path>
          </svg>
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3.5"></circle>
            <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"></path>
          </svg>
        </button>
        <button id="refresh-button" class="icon-button" type="button" aria-label="刷新最新数据">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11a8 8 0 1 0-2.35 5.65M20 5v6h-6"></path>
          </svg>
        </button>
      </div>
    </header>

    <div class="app-frame">
      <nav class="primary-nav" aria-label="主要导航">
        <a href="#overview" data-view="overview" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9m6 10V5m6 14v-7m4 7H2"></path></svg>
          <span>晨报</span>
        </a>
        <a href="#transmission" data-view="transmission">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18m0 0-4-4m4 4 4-4M6 7h12"></path></svg>
          <span>专题</span>
        </a>
        <a href="#ledger" data-view="ledger">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8m-8 4h8m-8 4h5"></path></svg>
          <span>指标</span>
        </a>
        <a href="#data" data-view="data">
          <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3"></ellipse><path d="M4 6v6c0 1.66 3.58 3 8 3s8-1.34 8-3V6m-16 6v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"></path></svg>
          <span>状态</span>
        </a>
      </nav>

      <main id="main-content" tabindex="-1">
        <section id="view-overview" class="view" aria-labelledby="overview-title">
          <div class="page-loading" aria-live="polite">
            <span class="skeleton skeleton-kicker"></span>
            <span class="skeleton skeleton-title"></span>
            <span class="skeleton skeleton-copy"></span>
            <span class="skeleton skeleton-panel"></span>
          </div>
        </section>
        <section id="view-transmission" class="view" aria-labelledby="transmission-title" hidden></section>
        <section id="view-ledger" class="view" aria-labelledby="ledger-title" hidden></section>
        <section id="view-data" class="view" aria-labelledby="data-title" hidden></section>
      </main>
    </div>

    <div id="live-region" class="sr-only" aria-live="polite"></div>
    <noscript>
      <p class="noscript">这个看板需要 JavaScript 才能显示数据和走势图。后台的数据更新不会受影响。</p>
    </noscript>
  </body>
</html>
